name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the floor declared in package.json engines (>=22.0.0), set in
        # #23 "require Node 22". Kept as a matrix so another version is a
        # one-line addition.
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: High-severity dependency audit
        run: npm run audit:high
